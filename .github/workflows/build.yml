name: nebulascreen build

# G82 (Run 15): ONE recipe for the image and for releases -
# scripts/build-release.sh, in the same digest-pinned NebulaOS build
# container NebulaOS-firmware uses (manifests/dependencies.conf
# BUILD_IMAGE_REPO/BUILD_IMAGE_DIGEST).
#   push to main  -> build + check the release zip, nothing is published
#   tag vX.Y.Z    -> build + check + publish exactly one asset,
#                    nebulascreen-vX.Y.Z.zip, as a normal (stable) release
# Moonraker's update_manager (type: zip, channel: stable) reads the latest
# stable release; the release name, the tag and release_info.json "version"
# are the same string. No nightly/prerelease channel any more.

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch: {}

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/nebulaos-ke/nebulaos-build@sha256:a6ba57c69fa1ea630b037a1d1f55cf0c044a7f5a403bde9b155ea54bca1cceba
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 1001
    env:
      CROSS_COMPILE: mipsel-buildroot-linux-musl-
      NEBULASCREEN_THEME: blue
      HOME: /tmp
      # The image keeps the Bootlin toolchain off the global PATH on purpose.
      PATH: /toolchains/mips32el--musl--stable-2024.02-1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - name: version
      run: |
        if [ "${GITHUB_REF_TYPE}" = tag ]; then
          v="${GITHUB_REF_NAME}"
          echo "$v" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "tag $v is not vMAJOR.MINOR.PATCH" >&2; exit 1; }
        else
          v="v0.0.0-main.$(git rev-parse --short HEAD)"
        fi
        echo "NEBULASCREEN_VERSION=$v" >> "$GITHUB_ENV"

    - name: host tests
      run: |
        env -u CROSS_COMPILE make test-nebulascreen-paths
        python3 tests/test_nebulascreen_release.py

    - name: build release
      run: bash scripts/build-release.sh "$NEBULASCREEN_VERSION"

    - uses: actions/upload-artifact@v7
      with:
        name: nebulascreen-${{ env.NEBULASCREEN_VERSION }}
        path: dist/nebulascreen-${{ env.NEBULASCREEN_VERSION }}.zip

    - name: stable release
      if: github.ref_type == 'tag'
      uses: softprops/action-gh-release@v3
      with:
        name: ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        prerelease: false
        files: dist/nebulascreen-${{ github.ref_name }}.zip
        fail_on_unmatched_files: true
        generate_release_notes: true
